name: BarnOwl
options:
  bundleIdPrefix: io.github.marvika
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  BarnOwl:
    type: application
    platform: macOS
    sources:
      - path: BarnOwl
      # The barnowl command ships inside the app, for Homebrew to link.
      - path: Scripts/barnowl
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: Barn Owl
        PRODUCT_MODULE_NAME: BarnOwl
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marvika.BarnOwl
        INFOPLIST_FILE: BarnOwl/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BarnOwl/Resources/BarnOwl.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: BarnOwl/Support/BarnOwl-Bridging-Header.h
        MARKETING_VERSION: 0.7.1
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BarnOwlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BarnOwlTests
    dependencies:
      - target: BarnOwl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.marvika.BarnOwlTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Barn Owl.app/Contents/MacOS/Barn Owl
schemes:
  BarnOwl:
    build:
      targets:
        BarnOwl: all
        BarnOwlTests: [test]
    test:
      targets:
        - BarnOwlTests
