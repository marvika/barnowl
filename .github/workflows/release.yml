# Pushing a tag like v0.8.0 builds, notarizes and drafts the GitHub release
# with Scripts/release.sh, then pushes the updated appcast.xml and cask to a
# release/v0.8.0 branch. Nothing reaches users until you publish the draft and
# merge that branch. The secrets it needs are listed in CONTRIBUTING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and draft the release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BARNOWL_TEAM: 2S5J2CYWPZ
      KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the tag matches project.yml
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *//p' project.yml | head -1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version in project.yml"
            exit 1
          fi
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          password=$(uuidgen)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # The intermediate certificate, in case the runner doesn't have it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Save the notary API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, notarize and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Scripts/release.sh --publish
      - name: Push the appcast and cask to a branch
        run: |
          branch="release/$GITHUB_REF_NAME"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Add $GITHUB_REF_NAME to the appcast and Homebrew cask"
          git push origin "$branch"
          {
            echo "### Barn Owl $GITHUB_REF_NAME is drafted"
            echo "1. Review and publish the [draft release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases)."
            echo "2. Merge [$branch]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1) into main. Installed copies offer the update from then on."
            echo "3. Run \`Scripts/update-tap.sh\` to update the Homebrew tap."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
