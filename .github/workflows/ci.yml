name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Build and run the tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project BarnOwl.xcodeproj -scheme BarnOwl \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            test | tee build/xcodebuild.log
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
